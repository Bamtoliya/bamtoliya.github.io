<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>BamOwl · 블로그 발행</title>
  <link rel="stylesheet" href="{{ '/assets/css/publisher.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/publisher-embed.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body>
  <main class="publisher-widget" data-worker="{{ site.publisher_url | escape }}">
    <button id="action" class="publisher-button" type="button" disabled>GitHub 로그인</button>
    <p id="status" role="status" aria-live="polite">발행 버튼을 준비하고 있습니다.</p>
    <div class="publisher-links">
      <a id="login-link" target="_blank" rel="noopener noreferrer" hidden>로그인 창 열기</a>
      <a id="run" target="_blank" rel="noopener noreferrer" hidden>작업 기록</a>
      <button id="cancel" type="button" hidden>연결 취소</button>
      <button id="disconnect" type="button" hidden>연결 해제</button>
    </div>
  </main>
</body>
</html>
